# PCBForge — configuração de ambiente
# Caminhos resolvidos automaticamente pelo `pcbforge doctor`.
# Defaults para macOS Intel; ajustar só se algo mudar de lugar.
#
# IMPORTANTE (Plano B de instalação, porque o Homebrew hoje não suporta Intel):
#   Python  -> uv (gerencia o próprio interpretador; venv em .venv/)
#   Java    -> Zulu 25 (tar.gz extraído em tools/, sem sudo)
#   KiCad   -> dmg oficial "universal" do kicad.org (cópia manual p/ /Applications)
#   Rotas   -> Freerouting JAR em tools/ (roda com o Zulu 25)

kicad:
  app_path: /Applications/KiCad.app
  cli: /Applications/KiCad.app/Contents/MacOS/kicad-cli
  # Bibliotecas oficiais embutidas no app (dmg "unified")
  symbols_dir: /Applications/KiCad.app/Contents/SharedSupport/symbols
  footprints_dir: /Applications/KiCad.app/Contents/SharedSupport/footprints
  models3d_dir: /Applications/KiCad.app/Contents/SharedSupport/3dmodels

python:
  venv_path: /Users/user/pcbforge/.venv
  min_version: "3.12"

java:
  binary: /Users/user/pcbforge/tools/zulu25.38.107-ca-jre25.0.5-macosx_x64/Contents/Home/bin/java
  version: "25.0.5"   # exigido pelo Freerouting 2.5 (class file 69)

freerouting:
  jar_path: /Users/user/pcbforge/tools/freerouting.jar
  default_timeout_s: 600

paths:
  project_root: /Users/user/pcbforge
  boards_dir: /Users/user/pcbforge/boards
  libcache_dir: /Users/user/pcbforge/libcache
  logs_dir: /Users/user/pcbforge/logs

defaults:
  mask_color: green
  silkscreen_color: white
  min_trace_mm: 0.25
  min_clearance_mm: 0.25
  min_via_mm: 0.5
  board_thickness_mm_by_layers:
    "1": 1.6
    "2": 1.6
    "4": 1.6
    "6": 1.6
